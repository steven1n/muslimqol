name: Bug Report
description: Report a defect, crash, or unexpected behavior in MuslimQoL
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and resolve it.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I tested with the latest available MuslimQoL release candidate.
          required: true
  - type: input
    id: version
    attributes:
      label: MuslimQoL Version
      description: Exact version of MuslimQoL installed (e.g. 0.1.0-rc1)
      placeholder: "0.1.0-rc1"
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      description: Minecraft version (e.g. 1.21.1)
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge Version
      description: Exact NeoForge build number (e.g. 21.1.176)
      placeholder: "21.1.176"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Java runtime version (e.g. 21.0.3, Oracle OpenJDK 21)
      placeholder: "Java 21"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      description: Operating system and version (e.g. Windows 11, macOS Sequoia, Ubuntu 24.04)
      placeholder: "Windows 11"
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Dedicated Server
        - LAN Multiplayer
    validations:
      required: true
  - type: textarea
    id: installed-mods
    attributes:
      label: Installed Mods
      description: Other installed mods, modpack name, or paste a mod list.
      placeholder: "MuslimQoL, Farmer's Delight, JEI..."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Hold item '...'
        2. Attempt to consume
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Report / Log Output
      description: |
        Paste relevant log snippets, or drag and drop your `logs/latest.log` / `crash-reports/crash-*.txt` file here.
        Alternatively, link to an external paste (e.g. mclo.gs, gist.github.com, pastebin).
      render: shell
    validations:
      required: false
